<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23161614'/><text x='50' y='68' font-family='Georgia, serif' font-size='54' font-weight='500' fill='%23FAF9F6' text-anchor='middle'>M</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahmud Tella — Full-Stack Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Mahmud Tella (@mahmudbuilds) — Full-Stack Software Engineer designing and shipping reliable web applications with TypeScript, React, Next.js, Python, and PostgreSQL."
    />

    <!-- Google Fonts: Newsreader (display serif), DM Sans (UI & body), JetBrains Mono (technical metadata) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..600;1,9..40,400..500&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap"
      rel="stylesheet"
    />

    <!-- Theme initialization to prevent flash of wrong theme -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem("theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "light" || (!stored && !prefersDark)) {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
          } else {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
